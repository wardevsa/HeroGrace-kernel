name: Build HeroGrace Kernel

on:
  push:
    branches: [ stable ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stable
          fetch-depth: 1
          submodules: recursive

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y make bc bison flex libssl-dev kmod cpio xz-utils

      - name: Build with GCC from Ubuntu repos
        run: |
          export CROSS_COMPILE=aarch64-linux-gnu-
          export ARCH=arm64
          export KCONFIG_NOTIMESTAMP=true
          export ANDROID_MAJOR_VERSION=14
          export KBUILD_BUILD_TIMESTAMP=''
          mkdir -p out
          make O=out hero_defconfig
          make -j$(nproc) O=out Image 2>&1 | tail -30

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: HeroGrace-kernel-Image
          path: out/arch/arm64/boot/Image
