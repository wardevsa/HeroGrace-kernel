name: Build HeroGrace Kernel

on:
  push:
    branches: [ stable ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stable
          fetch-depth: 1

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y make bc bison flex libssl-dev kmod cpio xz-utils wget gcc-aarch64-linux-gnu

      - name: Patch kernel sources
        run: |
          # Fix missing BUG() include in exynos-ss.h
          find . -name exynos-ss.h -exec sed -i '1i#include <linux/bug.h>' {} \;

      - name: Set up build config
        run: |
          export CROSS_COMPILE=aarch64-linux-gnu-
          export ARCH=arm64
          export KCONFIG_NOTIMESTAMP=true
          export ANDROID_MAJOR_VERSION=14
          mkdir -p out
          make O=out hero_defconfig

      - name: Build
        run: |
          export CROSS_COMPILE=aarch64-linux-gnu-
          export ARCH=arm64
          export KCONFIG_NOTIMESTAMP=true
          export ANDROID_MAJOR_VERSION=14
          # Set KBUILD_CFLAGS before invoking make
          make -j$(nproc) O=out Image 2>&1
        env:
          KBUILD_CFLAGS: -Wno-error

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: HeroGrace-kernel-Image
          path: out/arch/arm64/boot/Image
          if-no-files-found: error