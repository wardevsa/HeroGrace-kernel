name: Build HeroGrace Kernel

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: boloaimer/HeroGrace-kernel
          ref: OneUI-8-exp
          fetch-depth: 1

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y make bc bison flex libssl-dev kmod cpio xz-utils gcc-aarch64-linux-gnu

      - name: Patch kernel sources
        run: |
          find . -name exynos-ss.h -exec sed -i '1i#include <linux/bug.h>' {} \;
          find . -name exynos-ss.h -exec sed -i '/exynos_ss_panic_handler_safe/d' {} \;
          find . -name exynos-ss.h -exec sed -i '/exynos_ss_clockevent/d' {} \;
          find . -name "*.c" -exec sed -i '/extern.*exynos_ss_panic_handler_safe/d' {} \;
          find . -name "*.c" -exec sed -i '/exynos_ss_panic_handler_safe(/d' {} \;
          find . -name "*.c" -exec sed -i 's/exynos_ss_clockevent([^)]*);//g' {} \;
          find . -name nmi.h -exec sed -i 's/void void sl_softirq_entry/void sl_softirq_entry/' {} \;
          # dlog_hook.c: missing includes for magic.h and sched.h
          sed -i '/^#include "mount.h"/a #include <linux/sched.h>\n#include <linux/magic.h>' fs/dlog_hook.c
          # input/input.h: provide dummy booster macros for missing CONFIG_ARCH_EXYNOS
          sed -i '/^#if defined(CONFIG_ARCH_EXYNOS)/i\
#ifndef CONFIG_ARCH_EXYNOS\n#define PROPERTY_BOOSTER(...) do {} while(0)\n#define SET_BOOSTER  do {} while(0)\n#define REMOVE_BOOSTER do {} while(0)\n#endif' include/linux/input/input.h

      - name: Build
        run: |
          export CROSS_COMPILE=aarch64-linux-gnu-
          export ARCH=arm64
          export KCONFIG_NOTIMESTAMP=true
          export PLATFORM_VERSION=14.0.0
          export ANDROID_MAJOR_VERSION=14
          mkdir -p out
          make O=out hero_defconfig
          # Force config options needed by Samsung scheduler (WALT/HMP load avg)
          for opt in CGROUPS CGROUP_SCHED FAIR_GROUP_SCHED CFS_BANDWIDTH; do
            sed -i "/^# CONFIG_${opt} is not set/d;/^CONFIG_${opt}=/d" out/.config
            echo "CONFIG_${opt}=y" >> out/.config
          done
          # Re-sync config after forced scheduler changes
          make O=out olddefconfig 2>&1
          # Force Mali GPU (T8XX + r7p0 for S7 Mali-T880)
          for opt in MALI_T8XX MALI_R7P0; do
            sed -i "/^# CONFIG_${opt} is not set/d;/^CONFIG_${opt}=/d" out/.config
            echo "CONFIG_${opt}=y" >> out/.config
          done
          # Patch arm/Kbuild: unconditionally include t8xx/r7p0/ (workaround: T8XX config no se activa)
          echo 'obj-y += t8xx/r7p0/' >> drivers/gpu/arm/Kbuild
          make -j$(nproc) O=out Image 2>&1
        env:
          KBUILD_CFLAGS: -Wno-error

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: HeroGrace-kernel-Image
          path: out/arch/arm64/boot/Image
          if-no-files-found: error