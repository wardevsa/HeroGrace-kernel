name: Build HeroGrace Kernel

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: boloaimer/HeroGrace-kernel
          ref: boloaimer
          fetch-depth: 1

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y make bc bison flex libssl-dev kmod cpio xz-utils gcc-aarch64-linux-gnu

      - name: Build
        run: |
          export CROSS_COMPILE=aarch64-linux-gnu-
          export ARCH=arm64
          export KCONFIG_NOTIMESTAMP=true
          export ANDROID_MAJOR_VERSION=14
          mkdir -p out
          make O=out hero_defconfig
          make -j$(nproc) O=out Image 2>&1

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: HeroGrace-kernel-Image
          path: out/arch/arm64/boot/Image
          if-no-files-found: error