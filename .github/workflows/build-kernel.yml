name: Build HeroGrace Kernel

on:
  push:
    branches: [ stable ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stable
          fetch-depth: 1

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y make bc bison flex libssl-dev kmod cpio xz-utils wget

      - name: Setup toolchain
        run: |
          git clone --depth 1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 tc
          echo "$(pwd)/tc/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          export CROSS_COMPILE=aarch64-linux-android-
          export ARCH=arm64
          export KCONFIG_NOTIMESTAMP=true
          export ANDROID_MAJOR_VERSION=14
          mkdir -p out
          make O=out hero_defconfig
          make -j$(nproc) O=out Image
          find ${{ github.workspace }}/out -name 'Image' -type f 2>/dev/null || find out -name 'Image' -type f

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: HeroGrace-kernel-Image
          path: ${{ github.workspace }}/out/arch/arm64/boot/Image
          if-no-files-found: warn