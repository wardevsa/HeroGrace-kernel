name: Build HeroGrace Kernel

on:
  push:
    branches: [ stable ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stable
          fetch-depth: 1

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y make bc bison flex libssl-dev kmod cpio xz-utils git

      - name: Setup TC
        run: |
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu-a/8.3-2019.03/binrel/gcc-arm-8.3-2019.03-x86_64-aarch64-linux-gnu.tar.xz -O gcc-arm.tar.xz
          tar -xf gcc-arm.tar.xz
          echo "$(pwd)/gcc-arm-8.3-2019.03-x86_64-aarch64-linux-gnu/bin" >> $GITHUB_PATH

      - name: Patch kernel sources
        run: |
          # Fix missing BUG() include in exynos-ss.h
          find . -name exynos-ss.h -exec sed -i '1i#include <linux/bug.h>' {} \;
          # Remove exynos_ss_panic_handler_safe macro + all calls + externs (breaks with GCC 10+)
          find . -name exynos-ss.h -exec sed -i '/exynos_ss_panic_handler_safe/d' {} \;
          find . -name "*.c" -exec sed -i 's/exynos_ss_panic_handler_safe([^)]*);//g' {} \;
          find . -name "*.c" -exec sed -i '/extern.*exynos_ss_panic_handler_safe/d' {} \;
          # Fix double void in nmi.h (GCC 13+)
          find . -name nmi.h -exec sed -i 's/void void sl_softirq_entry/void sl_softirq_entry/' {} \;

      - name: Set up build config
        run: |
          export CROSS_COMPILE=aarch64-linux-gnu-
          export ARCH=arm64
          export KCONFIG_NOTIMESTAMP=true
          export ANDROID_MAJOR_VERSION=14
          mkdir -p out
          make O=out hero_defconfig

      - name: Build
        run: |
          export CROSS_COMPILE=aarch64-linux-gnu-
          export ARCH=arm64
          export KCONFIG_NOTIMESTAMP=true
          export ANDROID_MAJOR_VERSION=14
          make -j$(nproc) O=out Image 2>&1

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: HeroGrace-kernel-Image
          path: out/arch/arm64/boot/Image
          if-no-files-found: error